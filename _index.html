<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Calculatrice</title>
  <meta name="description" content="Calculatrice avec convertisseur d'unités" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Calculatrice" />
  <link rel="manifest" href="#" id="manifest-link" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #install-banner {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #1a1a2e;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      z-index: 9999;
      gap: 12px;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    #install-banner .info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }
    #install-banner .icon {
      width: 36px;
      height: 36px;
      background: #e94560;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    #install-banner .text .title {
      font-weight: 600;
      font-size: 14px;
    }
    #install-banner .text .sub {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 1px;
    }
    #install-btn {
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    #close-banner {
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }
    #app-frame {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #app-frame.with-banner {
      top: 57px;
      height: calc(100% - 57px);
    }
    #ios-hint {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #1a1a2e;
      color: #fff;
      padding: 14px 20px 24px;
      font-size: 13px;
      text-align: center;
      z-index: 9999;
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
    }
    #ios-hint .arrow {
      font-size: 24px;
      display: block;
      margin-top: 6px;
      animation: bounce 1.2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }
    #ios-hint-close {
      position: absolute;
      top: 10px; right: 14px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.5);
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="install-banner" style="display:none;">
    <div class="info">
      <div class="icon">🧮</div>
      <div class="text">
        <div class="title">Calculatrice</div>
        <div class="sub">Installer comme application</div>
      </div>
    </div>
    <button id="install-btn">Installer</button>
    <button id="close-banner" aria-label="Fermer">×</button>
  </div>
  <div id="ios-hint">
    <button id="ios-hint-close">×</button>
    <strong>Installer sur iPhone</strong><br>
    Appuyez sur <strong>Partager</strong> puis <strong>"Sur l'écran d'accueil"</strong>
    <span class="arrow">⬇</span>
  </div>
  <iframe
    id="app-frame"
    src="https://metaplik.github.io/crypt/"
    title="Calculatrice"
    allow="fullscreen"
  ></iframe>
  <script>
    const MANIFEST = {
      name: "Calculatrice",
      short_name: "Calc",
      description: "Calculatrice avec convertisseur d'unités",
      start_url: "https://metaplik.github.io/crypt/",
      display: "standalone",
      background_color: "#000000",
      theme_color: "#1a1a2e",
      orientation: "portrait",
      icons: [
        {
          src: "data:image/svg+xml," + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
              <rect width="192" height="192" rx="32" fill="#1a1a2e"/>
              <text x="96" y="130" font-size="100" text-anchor="middle" fill="#e94560">🧮</text>
            </svg>
          `),
          sizes: "192x192",
          type: "image/svg+xml"
        }
      ]
    };
    const blob = new Blob([JSON.stringify(MANIFEST)], { type: "application/json" });
    const manifestURL = URL.createObjectURL(blob);
    document.getElementById("manifest-link").href = manifestURL;
    const banner = document.getElementById("install-banner");
    const frame = document.getElementById("app-frame");
    const installBtn = document.getElementById("install-btn");
    const closeBanner = document.getElementById("close-banner");
    const iosHint = document.getElementById("ios-hint");
    const iosHintClose = document.getElementById("ios-hint-close");
    let deferredPrompt = null;
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    const dismissed = sessionStorage.getItem("banner-dismissed");
    if (!isStandalone && !dismissed) {
      if (isIOS) {
        setTimeout(() => {
          iosHint.style.display = "block";
        }, 1500);
      }
    }
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isStandalone && !dismissed) {
        banner.style.display = "flex";
        frame.classList.add("with-banner");
      }
    });
    installBtn.addEventListener("click", async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (outcome === "accepted") {
          banner.style.display = "none";
          frame.classList.remove("with-banner");
        }
      }
    });
    closeBanner.addEventListener("click", () => {
      banner.style.display = "none";
      frame.classList.remove("with-banner");
      sessionStorage.setItem("banner-dismissed", "1");
    });
    iosHintClose.addEventListener("click", () => {
      iosHint.style.display = "none";
      sessionStorage.setItem("banner-dismissed", "1");
    });
    if ("serviceWorker" in navigator) {
      const swCode = `
        const CACHE = "calc-v1";
        self.addEventListener("install", e => {
          e.waitUntil(caches.open(CACHE).then(c => c.addAll([])));
          self.skipWaiting();
        });
        self.addEventListener("activate", e => {
          e.waitUntil(clients.claim());
        });
        self.addEventListener("fetch", e => {
          e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
        });
      `;
      const swBlob = new Blob([swCode], { type: "application/javascript" });
      const swURL = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swURL).catch(() => {});
    }
  </script>
</body>
</html>
